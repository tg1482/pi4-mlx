[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi4"
version = "0.1.0"
description = "π⁴: A Foundation Model for 4D Scene Geometry and Motion"
authors = [{name = "Physical Intelligence Team"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "torch==2.12.1; sys_platform == 'linux'",
    "torch>=2.12; sys_platform != 'linux'",
    "safetensors>=0.4",
    "huggingface-hub>=0.27",
    "triton==3.7.1; sys_platform == 'linux'",
    "flex_gemm @ git+https://github.com/JeffreyXiang/FlexGEMM.git@b2fadb29d41846c7981ade6801ffc689fae119cf ; sys_platform == 'linux'",
]

[project.optional-dependencies]
example = ["numpy", "Pillow", "opencv-python-headless"]
mlx = ["mlx"]

[project.urls]
Repository = "https://github.com/yyfz/Pi4"
"Model weights" = "https://huggingface.co/yyfz233/Pi4"

[tool.setuptools.packages.find]
include = ["pi4", "pi4.*"]
namespaces = false

[tool.setuptools]
license-files = ["LICENSE", "LICENSE_MODEL", "NOTICE", "licenses/*.txt"]
